management.health.redis.enabled=false

mosip.certify.access-token-expire-seconds=86400
mosip.certify.certificatedatacache-expire-seconds=3600
mosip.certify.common.cache-expire-seconds=3600
# JWKS cache valid for 5 minutes
mosip.certify.jwks-cache-expire-seconds=300

mosip.certify.cache.names=userinfo,vcissuance,certificatedatacache,credentialConfig,renderTemplate,jwks,preAuthCodeCache,asMetadataCache,preAuthCacheTxn,nonce,credentialOfferCache,dpopJti
# Cache size setup is applicable only for 'simple' cache type.
# Cache size configuration will not be considered with 'Redis' cache type
# dpopJti is bounded because with 'simple' cache the replay cache would otherwise grow
# with every accepted proof until the TTL expires it. At the default 120s TTL, 10000
# entries covers a sustained ~83 proofs/second; raise it for higher issuance rates.
mosip.certify.cache.size={'userinfo': 200, 'vcissuance' : 2000, 'jwks': 1, 'preAuthCodeCache': 1000, 'credentialOfferCache': 1000, 'dpopJti': 10000 }

mosip.certify.credential-offer.cache-expire-seconds=600

# Cache expire in seconds is applicable for both 'simple' and 'Redis' cache type
mosip.certify.cache.expire-in-seconds={'userinfo': ${mosip.certify.access-token-expire-seconds}, 'vcissuance': ${mosip.certify.access-token-expire-seconds}, 'certificatedatacache': ${mosip.certify.certificatedatacache-expire-seconds}, 'credentialConfig': ${mosip.certify.common.cache-expire-seconds}, 'renderTemplate': ${mosip.certify.common.cache-expire-seconds}, 'jwks': ${mosip.certify.jwks-cache-expire-seconds}, 'preAuthCacheTxn': ${mosip.certify.access-token-expire-seconds}, 'nonce': ${mosip.certify.cnonce-expire-seconds}, 'credentialOfferCache': ${mosip.certify.credential-offer.cache-expire-seconds}, 'dpopJti': ${mosip.certify.dpop.jti.expire.seconds}}
