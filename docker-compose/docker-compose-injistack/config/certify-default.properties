## ---------------------------------------- inji-verify Library Configuration (embedded in-process) --------------------------------------------------------

mosip.certify.verify.service.verifier-client-id=certify-verifier-client

mosip.certify.vp-request.config-file-url=http://certify-nginx/vp_request_config.json

## inji-verify library properties
inji.vp-request.long-polling-timeout=55000
inji.vp-submission.base-url=${mosip.certify.oauth.interactive-authorization-endpoint}
inji.did.verify.public.key.uri=${mosip.certify.data-provider-plugin.did-url}#key-0
inji.did.verify.uri=${mosip.certify.data-provider-plugin.did-url}
inji.keystore.file.path=classpath:sample-keystore/test.p12
inji.keystore.file.pass=mosip
inji.verify.claims-with-meta-data=_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
# Used by verify-core only when the response-code flow is enabled: base URI to which
# "#response_code=<code>" is appended and returned to the wallet so the browser can bounce
# back after VP submission.
inji.verify.redirect-uri=${mosip.certify.domain.url}${server.servlet.path}

