# Context Caching

# Cache
mosip.certify.jsonld.cache.enabled=true
mosip.certify.jsonld.cache.maxEntries=512
mosip.certify.jsonld.cache.ttl=24h

# Remote context resolution
mosip.certify.jsonld.remote.enabled=true

# allowUnknown: controls whether contexts NOT listed in the "contexts" registry below can be fetched remotely.
#   false => only contexts explicitly listed in "contexts" map are allowed (recommended for production)
#   true  => unknown context IRIs may be fetched remotely (subject to allowedHosts below)
mosip.certify.jsonld.remote.allowUnknown=true

# Allowed hosts for remote context fetching.
# If non-empty, only these hosts are permitted for remote fetches (both configured and unknown contexts).
# Redirect hops are always validated against this list (even with allowUnknown=true).
# If empty, no host restriction is applied.
# Add your own hosted context domains to this list.
mosip.certify.jsonld.remote.allowedHosts[0]=www.w3.org
mosip.certify.jsonld.remote.allowedHosts[1]=w3id.org
mosip.certify.jsonld.remote.allowedHosts[2]=inji.github.io
mosip.certify.jsonld.remote.allowedHosts[3]=api.released.mosip.net

