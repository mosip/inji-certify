## ---------------------------------------- DPoP (RFC 9449) ------------------------------------------
# Signature algorithms accepted on a DPoP proof, and advertised in the algs parameter of
# the WWW-Authenticate challenge so a client that guessed wrong is told what this issuer
# takes. Asymmetric only: MAC and none are refused whatever is listed here. eSignet
# carries the equivalent list in its discovery document as dpop_signing_alg_values_supported;
# certify publishes no protected-resource metadata to carry it, so it stays a property.
mosip.certify.dpop.allowed-algorithms=ES256,ES384,ES512,RS256,PS256,EdDSA
# How old a DPoP proof's iat may be, and the tolerance for clock drift on either side.
# clock-skew matches eSignet's mosip.esignet.dpop.clock-skew=10. proof-max-age has no
# eSignet counterpart: eSignet hands iat to Nimbus's DefaultJWTClaimsVerifier, which
# requires the claim but range-checks only exp/nbf, so it bounds proof age only if the
# client sets exp. RFC 9449 section 11.1 puts that bound on the server.
mosip.certify.dpop.proof-max-age=60
mosip.certify.dpop.clock-skew=10
# TTL of the jti replay cache. MUST be at least proof-max-age + clock-skew: a jti dropped
# while its proof is still within the freshness window leaves that proof replayable.
mosip.certify.dpop.jti.expire.seconds=120

mosip.certify.identifier=${mosip.certify.domain.url}
mosip.certify.authn.filter-urls={ '${server.servlet.path}/issuance/credential' }
mosip.certify.authn.issuer-uri=${mosip.certify.authorization.url}/v1/esignet
mosip.certify.authn.jwk-set-uri=https://esignet-mock.collab.mosip.net/v1/esignet/oauth/.well-known/jwks.json
mosip.certify.authn.allowed-audiences={ '${mosip.certify.domain.url}${server.servlet.path}/issuance/credential', '${mosip.certify.authorization.url}/v1/esignet/vci/credential' }

