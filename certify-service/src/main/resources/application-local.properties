## ------------------------------------------- DPoP (RFC 9449) -------------------------------------------
# Signature algorithms accepted on a DPoP proof, and advertised in the algs parameter of
# the WWW-Authenticate challenge so a client that guessed wrong is told what this issuer
# takes. Asymmetric only: MAC and none are refused whatever is listed here. eSignet
# carries the equivalent list in its discovery document as dpop_signing_alg_values_supported;
# certify publishes no protected-resource metadata to carry it, so it stays a property.
mosip.certify.dpop.allowed-algorithms=ES256,ES384,ES512,RS256,PS256,EdDSA
# How old a DPoP proof's iat may be, and the tolerance for clock drift on either side.
# clock-skew matches eSignet's mosip.esignet.dpop.clock-skew=10. proof-max-age has no
# eSignet counterpart: eSignet hands iat to Nimbus's DefaultJWTClaimsVerifier, which
# requires the claim but range-checks only exp/nbf, so it bounds proof age only if the
# client sets exp. RFC 9449 section 11.1 puts that bound on the server.
mosip.certify.dpop.proof-max-age=60
mosip.certify.dpop.clock-skew=10
# TTL of the jti replay cache. MUST be at least proof-max-age + clock-skew: a jti dropped
# while its proof is still within the freshness window leaves that proof replayable.
mosip.certify.dpop.jti.expire.seconds=120

mosip.certify.certificatedatacache-expire-seconds=3600
mosip.certify.common.cache-expire-seconds=3600
# JWKS cache valid for 5 minutes (certificates don't change frequently)
mosip.certify.jwks-cache-expire-seconds=300
# Cache size setup is applicable only for 'simple' cache type.
# Cache size configuration will not be considered with 'Redis' cache type
# dpopJti is bounded because with 'simple' cache the replay cache would otherwise grow
# with every accepted proof until the TTL expires it. At the default 120s TTL, 10000
# entries covers a sustained ~83 proofs/second; raise it for higher issuance rates.
mosip.certify.cache.size={'userinfo': 200, 'vcissuance' : 2000, 'templatecache': 20, 'jwks': 1, 'preAuthCodeCache': 1000, 'credentialOfferCache': 1000, 'issuerMetadataCache': 10, 'nonce': 1000, 'preAuthCacheTxn' : 2000, 'dpopJti': 10000}

# Cache expire in seconds is applicable for both 'simple' and 'Redis' cache type
mosip.certify.cache.expire-in-seconds={'userinfo': ${mosip.certify.access-token-expire-seconds}, 'vcissuance': ${mosip.certify.access-token-expire-seconds}, 'templatecache': ${mosip.certify.templatecache-expire-seconds}, 'certificatedatacache': ${mosip.certify.certificatedatacache-expire-seconds}, 'credentialConfig': ${mosip.certify.common.cache-expire-seconds}, 'renderTemplate': ${mosip.certify.common.cache-expire-seconds}, 'jwks': ${mosip.certify.jwks-cache-expire-seconds}, 'preAuthCodeCache': ${mosip.certify.pre-auth.cache-expire-seconds}, 'credentialOfferCache': ${mosip.certify.credential-offer.cache-expire-seconds}, 'issuerMetadataCache': ${mosip.certify.metadata.cache-expire-seconds}, 'nonce': ${mosip.certify.cnonce.cache-expire-seconds}, 'preAuthCacheTxn': ${mosip.certify.access-token-expire-seconds}, 'dpopJti': ${mosip.certify.dpop.jti.expire.seconds}}

