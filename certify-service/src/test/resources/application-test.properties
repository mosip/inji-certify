#------------------------------------ Key-manager specific properties --------------------------------------------------

#Crypto asymmetric algorithm name
mosip.kernel.crypto.asymmetric-algorithm-name=RSA/ECB/OAEPWITHSHA-256ANDMGF1PADDING
#Crypto symmetric algorithm name
mosip.kernel.crypto.symmetric-algorithm-name=AES/GCM/NoPadding
#Keygenerator asymmetric algorithm name
mosip.kernel.keygenerator.asymmetric-algorithm-name=RSA
#Keygenerator symmetric algorithm name
mosip.kernel.keygenerator.symmetric-algorithm-name=AES
#Asymmetric algorithm key length
mosip.kernel.keygenerator.asymmetric-key-length=2048
#Symmetric algorithm key length
mosip.kernel.keygenerator.symmetric-key-length=256
#Encrypted data and encrypted symmetric key separator
mosip.kernel.data-key-splitter=#KEY_SPLITTER#
#GCM tag length
mosip.kernel.crypto.gcm-tag-length=128
#Hash algo name
mosip.kernel.crypto.hash-algorithm-name=PBKDF2WithHmacSHA512
#Symmtric key length used in hash
mosip.kernel.crypto.hash-symmetric-key-length=256
#No of iterations in hash
mosip.kernel.crypto.hash-iteration=100000
#Sign algo name
mosip.kernel.crypto.sign-algorithm-name=RS256
#Certificate Sign algo name
mosip.kernel.certificate.sign.algorithm=SHA256withRSA

mosip.kernel.keymanager.hsm.config-path=test/local.p12
mosip.kernel.keymanager.hsm.keystore-type=PKCS12
mosip.kernel.keymanager.hsm.keystore-pass=test

mosip.kernel.keymanager.certificate.default.common-name=www.mosip.io
mosip.kernel.keymanager.certificate.default.organizational-unit=MOSIP Engineering
mosip.kernel.keymanager.certificate.default.organization=IIITB
mosip.kernel.keymanager.certificate.default.location=BANGALORE
mosip.kernel.keymanager.certificate.default.state=KA
mosip.kernel.keymanager.certificate.default.country=IN

mosip.kernel.keymanager.softhsm.certificate.common-name=www.mosip.io
mosip.kernel.keymanager.softhsm.certificate.organizational-unit=MOSIP
mosip.kernel.keymanager.softhsm.certificate.organization=IIITB
mosip.kernel.keymanager.softhsm.certificate.country=IN

# Application Id for PMS master key.
mosip.kernel.partner.sign.masterkey.application.id=PMS
mosip.kernel.partner.allowed.domains=DEVICE

mosip.kernel.keymanager-service-validate-url=https://${mosip.hostname}/keymanager/validate
mosip.keymanager.dao.enabled=false
mosip.kernel.keymanager.jwtsign.validate.json=false
crypto.PrependThumbprint.enable=true

mosip.certify.cache.security.secretkey.reference-id=TRANSACTION_CACHE

## ------------------------------------------- OAuth AS Metadata Configuration -------------------------------------------
mosip.certify.oauth.issuer=http://localhost:8090
mosip.certify.oauth.token-endpoint=http://localhost:8090/v1/certify/oauth/token
mosip.certify.oauth.jwks-uri=${mosip.certify.domain.url}/v1/certify/oauth/.well-known/jwks.json
mosip.certify.oauth.grant-types-supported=authorization_code
mosip.certify.oauth.response-types-supported=code
mosip.certify.oauth.code-challenge-methods-supported=S256
mosip.certify.oauth.interactive-authorization-endpoint=http://localhost:8090/v1/certify/oauth/iae
mosip.certify.oauth.require-interactive-authorization-request=true
mosip.certify.oauth.access-token.audience=${mosip.certify.identifier}/v1/certify/issuance/credential

##----------------------------------------- Database properties --------------------------------------------------------

spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#Enabling H2 console
spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:mem:mosip_esignet
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

mosip.certify.vp-request.config-file-url=vp_request_config.json

mosip.certify.credential-offer-url=${mosip.certify.domain.url}${server.servlet.path}/credential-offer-data/

## inji-verify library integration
mosip.certify.verify.service.verifier-client-id=certify-verifier-client

## inji-verify library properties
inji.vp-request.long-polling-timeout=55000
inji.vp-submission.base-url=${mosip.certify.oauth.interactive-authorization-endpoint}
inji.did.verify.public.key.uri=did:web:localhost:v1:certify#key-0
inji.did.verify.uri=did:web:localhost:v1:certify
inji.keystore.file.path=classpath:sample-keystore/test.p12
inji.keystore.file.pass=mosip
inji.verify.claims-with-meta-data=_sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
inji.verify.redirect-uri=http://localhost:8090/v1/certify

