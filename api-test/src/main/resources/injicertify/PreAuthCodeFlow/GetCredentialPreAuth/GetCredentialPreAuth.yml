GetCredentialPreAuth:
  InjiCertify_GetCredentialForPreAuthCode_IdpAccessToken_Valid_Smoke_sid:
    endPoint: $INJICERTIFYBASEURL$/v1/certify/issuance/credential
    uniqueIdentifier: TC_preauth_GetCredential_01
    description: Get verifiable credential using access token and c_nonce from certify nonce endpoint
    role: noauth
    checkErrorsOnlyInResponse: true
    restMethod: post
    validityCheckRequired: true
    inputTemplate: injicertify/PreAuthCodeFlow/GetCredentialPreAuth/GetCredentialPreAuth
    outputTemplate: injicertify/PreAuthCodeFlow/GetCredentialPreAuth/GetCredentialPreAuthResult
    input: '{
      "client_id": "",
      "idpAccessToken": "$ID:TokenExchange_preauthcode_Valid_Smoke_sid_access_token$",
      "c_nonce": "$ID:PreAuthCode_GenerateNonce_StatusCode_Valid_Smoke_sid_c_nonce$",
      "credential_configuration_id": "UniversityCredential",
      "proof_jwt": "$PROOF_JWT_3$",
      "credentialType": "UniversityCredential",
      "signatureSupported": "RS256"
      }'
    output: '{
      }'

