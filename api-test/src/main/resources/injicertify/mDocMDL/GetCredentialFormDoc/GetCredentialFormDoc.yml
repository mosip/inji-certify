GetCredentialFormDoc:
   InjiCertify_GetCredentialFormdl_IdpAccessToken_all_Valid_Smoke:
      endPoint: $INJICERTIFYBASEURL$/v1/certify/issuance/credential
      uniqueIdentifier: TC_InjiCertify_GetCredentialFormDoc_01
      description: Get credentials for mDoc with all valid parameters
      role: resident
      checkErrorsOnlyInResponse: true
      restMethod: post
      validityCheckRequired: true
      inputTemplate: injicertify/mDocMDL/GetCredentialFormDoc/GetCredentialFormDoc
      outputTemplate: injicertify/mDocMDL/GetCredentialFormDoc/GetCredentialFormDocResult
      input: '{
      	"client_id": "$ID:ESignet_CreateOIDCClientV2_Formdl_all_Valid_Smoke_sid_clientId$",
        "idpAccessToken": "$ID:ESignet_GenerateToken_Formdl_Valid_Smoke_sid_access_token$",
        "c_nonce": "$ID:Formdl_GenerateNonce_StatusCode_Valid_Smoke_sid_c_nonce$",
        "credential_configuration_id": "$ID:AddCredentialConfig_mdl_all_Valid_Smoke_sid_id$",
        "doctype": "org.iso.18013.5.1.mDL",
      	"proof_type": "jwt",
        "proof_jwt": "$PROOF_JWT_ES256$"
}'
      output: '{
}'

   InjiCertify_GetCredentialFormdl_IdpAccessToken_without_DocType:
