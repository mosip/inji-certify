GetCredentialConfigurationForMdoc:
  InjiCertify_GetCredentialConfig_mdl_MetaAttrs_valid_all_Valid_Smoke:
    endPoint: $INJICERTIFYBASEURL$/v1/certify/credential-configurations/{configurationId}
    uniqueIdentifier: TC_InjiCertify_mdl_MetaAttrs_Get_01
    description: The stored mDoc configuration holds exactly the binding, proof types and signing algorithm that were declared
    role: noauth
    restMethod: get
    additionalDependencies: TC_InjiCertify_mdl_MetaAttrs_Add_01
    inputTemplate: injicertify/CredentialConfig/GetCredentialConfiguration/GetCredentialConfiguration
    outputTemplate: injicertify/mDocMDL/GetCredentialConfigurationForMdoc/GetCredentialConfigurationForMdocResult
    input: '{
      "configurationId": "$ID:AddCredentialConfig_mdl_MetaAttrs_valid_sid_id$"
    }'
    output: '{
      "cryptographicBindingMethodsSupported": ["cose_key"],
      "proofTypesSupported": {"jwt": {"proof_signing_alg_values_supported": ["ES256"]}},
      "credentialFormat": "mso_mdoc",
      "signatureAlgo": "ES256",
      "doctype": "org.iso.18013.5.1.mDL_metaattrs_valid"
    }'

  InjiCertify_GetCredentialConfig_mdl_MetaAttrs_duplicates_all_Valid_Smoke:
    endPoint: $INJICERTIFYBASEURL$/v1/certify/credential-configurations/{configurationId}
    uniqueIdentifier: TC_InjiCertify_mdl_MetaAttrs_Get_02
    description: Repeated values are stored once, and the signing algorithm is kept even though no signatureCryptoSuite was sent
    role: noauth
    restMethod: get
    additionalDependencies: TC_InjiCertify_mdl_MetaAttrs_Add_02
    inputTemplate: injicertify/CredentialConfig/GetCredentialConfiguration/GetCredentialConfiguration
    outputTemplate: injicertify/mDocMDL/GetCredentialConfigurationForMdoc/GetCredentialConfigurationForMdocResult
    input: '{
      "configurationId": "$ID:AddCredentialConfig_mdl_MetaAttrs_duplicates_sid_id$"
    }'
    output: '{
      "cryptographicBindingMethodsSupported": ["cose_key"],
      "proofTypesSupported": {"jwt": {"proof_signing_alg_values_supported": ["ES256"]}},
      "credentialFormat": "mso_mdoc",
      "signatureAlgo": "ES256",
      "doctype": "org.iso.18013.5.1.mDL_metaattrs_duplicates"
    }'
